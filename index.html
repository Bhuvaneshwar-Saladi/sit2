        function toggleCustomCropInput(val) {
            const customInput = document.getElementById('customCropInput');
            if (val === 'other') {
                customInput.classList.remove('hidden');
                customInput.required = true;
            } else {
                customInput.classList.add('hidden');
                customInput.required = false;
                customInput.value = '';
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            ['clinic', 'advisor', 'bazaar', 'mandi'].forEach(t => {
                const navBtn = document.getElementById(`nav-${t}`);
                const iconDiv = document.getElementById(`icon-${t}`);
                if (t === tab) {
                    navBtn.className = "w-full flex flex-col items-center justify-center gap-1 transition-colors text-emerald-600 font-bold";
                    iconDiv.className = "p-1.5 rounded-xl bg-emerald-100 transition-all";
                } else {
                    navBtn.className = "w-full flex flex-col items-center justify-center gap-1 transition-colors text-slate-400 hover:text-slate-600 font-medium";
                    iconDiv.className = "p-1.5 rounded-xl transition-all";
                }
            });
            renderContent();
        }

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[currentLang];
            
            document.getElementById('headerTitle').innerText = t.headerTitle;
            document.getElementById('headerSub').innerText = t.headerSub;

            document.querySelectorAll('[data-nav]').forEach(el => {
                const key = el.getAttribute('data-nav');
                if (t['tab' + key.charAt(0).toUpperCase() + key.slice(1)]) {
                    el.innerText = t['tab' + key.charAt(0).toUpperCase() + key.slice(1)];
                }
            });

            renderContent();
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = () => {
                    selectedImageSrc = reader.result;
                    currentDiseaseKey = 'unknown_object'; 
                    scanResultReadyState = false;
                    renderContent();
                };
                reader.readAsDataURL(file);
            }
        }

        function selectSampleLeaf(type) {
            currentDiseaseKey = type;
            if(type === 'blight') selectedImageSrc = 'https://images.unsplash.com/photo-1592841200221-a6898f307baa?auto=format&fit=crop&w=600&q=80';
            else if(type === 'yellowing') selectedImageSrc = 'https://images.unsplash.com/photo-1530184469502-3932e52467d5?auto=format&fit=crop&w=600&q=80';
            else if(type === 'pest') selectedImageSrc = 'https://images.unsplash.com/photo-1621217346747-9cefc9440656?auto=format&fit=crop&w=600&q=80';
            else selectedImageSrc = 'https://images.unsplash.com/photo-1502877338535-766e1452684a?auto=format&fit=crop&w=600&q=80';
            
            triggerScanProcess();
        }

        function resetImage() {
            selectedImageSrc = null;
            currentDiseaseKey = 'unknown_object';
            scanResultReadyState = false;
            isScanningState = false;
            renderContent();
        }

        function triggerScanProcess() {
            if (!selectedImageSrc) return;
            isScanningState = true;
            scanResultReadyState = false;
            renderContent();

            setTimeout(() => {
                isScanningState = false;
                scanResultReadyState = true;
                renderContent();
            }, 1000);
        }

        function setTreatmentTab(tab) {
            activeTreatmentTabState = tab;
            renderContent();
        }

        function speakInstructionsText() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const disease = diseasesDB[currentDiseaseKey][currentLang];
                const textToSpeak = `${disease.title}. ${disease.org.replace(/<[^>]*>?/gm, '')}`;
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = currentLang === 'te' ? 'te-IN' : currentLang === 'hi' ? 'hi-IN' : 'en-US';
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Text-to-speech not supported on this browser.");
            }
        }

        function handleAdvisorSubmit(event) {
            event.preventDefault();
            isAnalyzingLand = true;
            renderContent();

            setTimeout(() => {
                isAnalyzingLand = false;
                showAdvisorResults = true;
                renderContent();
            }, 2000);
        }

        function resetAdvisor() {
            showAdvisorResults = false;
            isAnalyzingLand = false;
            renderContent();

        function togglePostModal() {
            showPostModalState = !showPostModalState;

        function handleMarketSubmit(event) {
            event.preventDefault();
            let cropKey = document.getElementById('cropNameInput').value;
            let customCrop = '';
            
            if (cropKey === 'other') {
                customCrop = document.getElementById('customCropInput').value;
            }
            
            const farmerName = document.getElementById('farmerNameInput').value;
            const phoneStr = document.getElementById('phoneInput').value;
            const qty = document.getElementById('qtyInput').value;
            const price = document.getElementById('priceInput').value;

            if (!qty || !price || !farmerName || !phoneStr) return;

            const newItem = {
                id: Date.now(),
                cropKey: cropKey,
                customCrop: customCrop,
                qtyNum: qty,
                unitKey: 'quintals',
                priceNum: price,
                priceSuffixKey: cropKey === 'paddy' ? 'perQtl' : 'perKg',
                farmerKey: 'custom', 
                customFarmer: farmerName,
                phone: phoneStr,
                distanceNum: '0.1'
            };

            marketListings.unshift(newItem);
            showPostModalState = false;
            postSuccessState = true;
            renderContent();

            setTimeout(() => {
                postSuccessState = false;
                renderContent();
            }, 3000);
        }

                                            <p class="text-[10px] text-slate-300 mt-0.5">${t.sampleChilliDesc}</p>
                                        </div>
                                    </button>
                                    <button onclick="selectSampleLeaf('unknown_object')" class="bg-white/10 hover:bg-white/20 border border-white/15 rounded-xl p-3 text-left transition-all hover:scale-[1.02] active:scale-95 flex items-start gap-2.5 group">
                                        <span class="text-2xl p-1 bg-white/10 rounded-lg">🚗</span>
                                        <div>
                                            <h4 class="text-xs font-bold text-white group-hover:text-amber-300">${t.sampleCotton}</h4>
                                            <p class="text-[10px] text-slate-300 mt-0.5">${t.sampleCottonDesc}</p>
                                        </div>
                                    </button>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            } else if (currentTab === 'advisor') {
                container.innerHTML = `
                    <div class="p-4 space-y-4">
                        <div class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-4 rounded-2xl shadow-md">
                            <div>
                                <h2 class="text-base font-bold">${t.advisorTitle}</h2>
                                <p class="text-xs text-emerald-100 mt-0.5">${t.advisorSub}</p>
                            </div>
                        </div>

                        ${!showAdvisorResults && !isAnalyzingLand ? `
                            <form onsubmit="handleAdvisorSubmit(event)" class="bg-white border border-emerald-200 rounded-2xl p-4 shadow-xl space-y-3 animate-fadeIn">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">${t.locationLabel}</label>
                                    <input type="text" id="advLocation" value="${t.district}" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs font-medium text-slate-500 focus:outline-none" readonly>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">${t.landSizeLabel}</label>
                                    <input type="number" id="advSize" required placeholder="5" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-600 mb-1">${t.soilLabel}</label>
                                        <select id="advSoil" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                            <option value="black">${t.soilOpts.black}</option>
                                            <option value="red">${t.soilOpts.red}</option>
                                            <option value="loamy">${t.soilOpts.loamy}</option>
                                            <option value="sandy">${t.soilOpts.sandy}</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-600 mb-1">${t.irrigationLabel}</label>
                                        <select id="advWater" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                            <option value="borewell">${t.irrigationOpts.borewell}</option>
                                            <option value="canal">${t.irrigationOpts.canal}</option>
                                            <option value="rainfed">${t.irrigationOpts.rainfed}</option>
                                        </select>
                                    </div>
                                </div>
                                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow text-xs transition-transform active:scale-95 mt-2 flex items-center justify-center gap-2">
                                    <i data-lucide="sparkles" class="w-4 h-4"></i> ${t.getSuggestBtn}
                                </button>
                            </form>
                        ` : ''}

                        ${isAnalyzingLand ? `
                            <div class="bg-emerald-900 text-white p-6 rounded-2xl text-center space-y-3 shadow-xl animate-pulse">
                                <div class="w-12 h-12 border-4 border-emerald-400 border-t-transparent rounded-full animate-spin mx-auto"></div>
                                <p class="text-sm font-semibold tracking-wide">${t.analyzingLand}</p>
                            </div>
                        ` : ''}

                        ${showAdvisorResults ? `
                            <div class="space-y-3 animate-fadeIn">
                                <button onclick="resetAdvisor()" class="text-xs text-emerald-600 font-bold flex items-center gap-1 mb-2 hover:underline">
                                    <i data-lucide="arrow-left" class="w-3 h-3"></i> ${t.backBtn}
                                </button>
                                
                                <div class="bg-white border border-emerald-200 rounded-2xl p-4 shadow-sm relative overflow-hidden">
                                    <div class="absolute top-0 right-0 bg-amber-500 text-white text-[10px] font-bold px-3 py-1 rounded-bl-xl">${t.bestMatch}</div>
                                    <div class="flex items-center gap-3 mb-2">
                                        <div class="text-3xl">🌶️</div>
                                        <div>
                                            <h3 class="font-bold text-slate-800 text-base">${t.cropOpts.chilli}</h3>
                                            <p class="text-[10px] text-slate-500">${t.durationLabel} 150-160${t.units.days}</p>
                                        </div>
                                    </div>
                                    <div class="bg-emerald-50 p-2 rounded-lg border border-emerald-100 flex justify-between items-center mt-3">
                                        <span class="text-xs text-emerald-800 font-medium">${t.estProfit}</span>
                                        <span class="text-sm font-bold text-emerald-700">₹2.5L - ₹3L ${t.units.acre}</span>
                                    </div>
                                </div>

                                <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm relative overflow-hidden">
                                    <div class="absolute top-0 right-0 bg-blue-500 text-white text-[10px] font-bold px-3 py-1 rounded-bl-xl">${t.highProfit}</div>
                                    <div class="flex items-center gap-3 mb-2">
                                        <div class="text-3xl">☁️</div>
                                        <div>
                                            <h3 class="font-bold text-slate-800 text-base">${t.cropOpts.cotton}</h3>
                                            <p class="text-[10px] text-slate-500">${t.durationLabel} 140-160${t.units.days}</p>
                                        </div>
                                    </div>
                                    <div class="bg-slate-50 p-2 rounded-lg border border-slate-100 flex justify-between items-center mt-3">
                                        <span class="text-xs text-slate-600 font-medium">${t.estProfit}</span>
                                        <span class="text-sm font-bold text-emerald-700">₹1.2L - ₹1.8L ${t.units.acre}</span>
                                    </div>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            } else if (currentTab === 'bazaar') {
                container.innerHTML = `
                    <div class="p-4 space-y-4">
                        <div class="flex justify-between items-center bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-4 rounded-2xl shadow-md">
                            <div>
                                <h2 class="text-base font-bold">${t.postTitle}</h2>
                                <p class="text-xs text-emerald-100 mt-0.5">${t.postSub}</p>
                            </div>
                            <button onclick="togglePostModal()" class="bg-white text-emerald-700 hover:bg-emerald-50 font-bold px-4 py-2.5 rounded-xl text-xs shadow transition-transform active:scale-95 flex items-center gap-1.5 shrink-0 ml-2">
                                ${showPostModalState ? t.closeBtn : t.addStockBtn}
                            </button>
                        </div>

                        ${postSuccessState ? `
                            <div class="bg-emerald-100 border border-emerald-300 text-emerald-800 p-3 rounded-xl text-xs font-semibold flex items-center gap-2">
                                <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-600"></i>
                                <span>${t.successMsg}</span>
                            </div>
                        ` : ''}

                        ${showPostModalState ? `
                            <form onsubmit="handleMarketSubmit(event)" class="bg-white border border-emerald-200 rounded-2xl p-4 shadow-xl space-y-3 animate-fadeIn">
                                <h3 class="font-bold text-slate-800 text-sm border-b pb-2">${t.postTitle}</h3>
                                
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">${t.farmerNameLabel}</label>
                                    <input type="text" id="farmerNameInput" required placeholder="${t.farmerNamePlaceholder}" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                </div>
                                
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">${t.phoneLabel}</label>
                                    <input type="tel" id="phoneInput" required pattern="[0-9]{10}" placeholder="${t.phonePlaceholder}" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                </div>

                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">${t.cropNameLabel}</label>
                                    <select id="cropNameInput" onchange="toggleCustomCropInput(this.value)" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs font-medium focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                        <option value="tomato">${t.cropOpts.tomato}</option>
                                        <option value="paddy">${t.cropOpts.paddy}</option>
                                        <option value="chilli">${t.cropOpts.chilli}</option>
                                        <option value="cotton">${t.cropOpts.cotton}</option>
                                        <option value="other">${t.cropOpts.other}</option>
                                    </select>
                                    <input type="text" id="customCropInput" placeholder="${t.customCropPlaceholder}" class="hidden w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs mt-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-600 mb-1">${t.qtyLabel}</label>
                                        <input type="number" id="qtyInput" required placeholder="e.g. 20" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-600 mb-1">${t.priceLabel}</label>
                                        <input type="number" id="priceInput" required placeholder="e.g. 24" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">${t.locationLabel}</label>
                                    <input type="text" id="locationInput" value="${t.district}" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                </div>
                                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow text-xs transition-transform active:scale-95 mt-2">
                                    ${t.submitListingBtn}
                                </button>
                            </form>
                        ` : ''}

                        <div>
                            <h3 class="font-bold text-slate-800 text-sm mb-3 px-1">${t.feedTitle}</h3>
                            <div class="space-y-3">
                                ${marketListings.map(item => {
                                    const cropName = item.cropKey === 'other' ? item.customCrop : (t.cropOpts[item.cropKey] || item.cropKey);
                                    const farmerName = item.farmerKey === 'custom' ? item.customFarmer : (t.farmers[item.farmerKey] || item.farmerKey);
                                    const unitName = t.units[item.unitKey] || item.unitKey;
                                    const priceSuffix = item.priceSuffixKey ? t.units[item.priceSuffixKey] : t.units.perKg;
                                    
                                    return `
                                    <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm hover:shadow-md transition-shadow">
                                        <div class="flex justify-between items-start">
                                            <div>
                                                <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">${cropName}</span>
                                                <h4 class="text-base font-bold text-slate-900 mt-1.5">${item.qtyNum}${unitName}</h4>
                                                <span class="text-xs font-semibold text-emerald-700">₹${item.priceNum}${priceSuffix}</span>
                                            </div>
                                            <div class="text-right">
                                                <span class="text-xs font-bold text-slate-700 block">${farmerName}</span>
                                                <span class="text-[11px] text-slate-600 font-mono tracking-wide mt-1 block font-semibold">+91 ${item.phone}</span>
                                                <span class="text-[11px] text-slate-500 flex items-center justify-end gap-1 mt-1">
                                                    <i data-lucide="map-pin" class="w-3 h-3 text-slate-400"></i> ${item.distanceNum}${t.distanceAway}
                                                </span>
                                            </div>
                                        </div>
                                        <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                                            <span class="text-[11px] text-slate-500 font-medium">${t.pickupText}</span>
                                            <a href="tel:+91${item.phone}" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow flex items-center gap-1.5 transition-transform active:scale-95">
                                                <i data-lucide="phone" class="w-3.5 h-3.5"></i>
                                                <span>${t.callFarmer}</span>
                                            </a>
                                        </div>
                                    </div>
                                `}).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'mandi') {
                const searchQ = mandiSearchQuery.toLowerCase();
                const filtered = mandiData.filter(i => {
                    const localName = t.commodities[i.commKey] || '';
                    return localName.toLowerCase().includes(searchQ);
                });

                container.innerHTML = `
                    <div class="p-4 space-y-4">
                        <div class="bg-gradient-to-br from-teal-700 to-emerald-800 text-white rounded-2xl p-4 shadow-lg space-y-3">
                            <div class="flex justify-between items-center">
                                <div>
                                    <h2 class="text-sm font-bold opacity-90">${t.weatherTitle}</h2>
                                    <span class="text-xs text-emerald-200 block">${t.district}</span>
                                </div>
                                <i data-lucide="cloud-sun" class="w-10 h-10 text-amber-300 animate-pulse"></i>
                            </div>
                            <div class="flex items-baseline justify-between border-t border-teal-600/50 pt-2">
                                <span class="text-2xl font-black">${t.temp}</span>
                                <span class="text-xs font-semibold bg-teal-900/60 px-2.5 py-1 rounded-lg border border-teal-500/30">${t.rainProb}</span>
                            </div>
                            <div class="bg-amber-500/20 border border-amber-400/40 rounded-xl p-3 flex items-start gap-2.5 text-xs text-amber-100 font-medium">
                                <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-300 flex-shrink-0 mt-0.5"></i>
                                <p class="leading-relaxed">${t.weatherAlert}</p>
                            </div>
                        </div>

                        <div class="space-y-3">
                            <div class="flex justify-between items-center px-1">
                                <h3 class="font-bold text-slate-800 text-sm">${t.mandiTitle}</h3>
                                <span class="text-[11px] text-emerald-700 font-semibold bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">${t.updatedToday}</span>
                            </div>
                            <div class="relative">
                                <i data-lucide="search" class="absolute left-3 top-3 w-4 h-4 text-slate-400"></i>
                                <input type="text" placeholder="${t.searchPlaceholder}" oninput="handleMandiSearch(event)" value="${mandiSearchQuery}" class="w-full bg-white border border-slate-300 rounded-xl pl-9 pr-4 py-2.5 text-xs font-medium focus:ring-2 focus:ring-emerald-500 focus:outline-none shadow-sm">
                            </div>
                            <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                                <div class="grid grid-cols-12 bg-slate-100 text-slate-600 text-[11px] font-bold p-3 border-b border-slate-200">
                                    <div class="col-span-6">${t.commodityHead}</div>
                                    <div class="col-span-4 text-right">${t.priceHead}</div>
                                    <div class="col-span-2 text-center">${t.trendHead}</div>
                                </div>
                                <div class="divide-y divide-slate-100">
                                    ${filtered.map(item => `
                                        <div class="grid grid-cols-12 p-3 text-xs items-center hover:bg-slate-50 transition-colors">
                                            <div class="col-span-6 font-bold text-slate-900">${t.commodities[item.commKey]}</div>
                                            <div class="col-span-4 text-right font-semibold text-emerald-700">₹${item.price}</div>
                                            <div class="col-span-2 flex justify-center">
                                                ${item.trend === 'up' ? `
                                                    <span class="bg-emerald-100 text-emerald-700 p-1 rounded-full"><i data-lucide="arrow-up-right" class="w-4 h-4"></i></span>
                                                ` : `
                                                    <span class="bg-rose-100 text-rose-700 p-1 rounded-full"><i data-lucide="arrow-down-right" class="w-4 h-4"></i></span>
                                                `}
                                            </div>
                                        </div>
                                    `).join('')}
                                    ${filtered.length === 0 ? `<div class="p-6 text-center text-xs text-slate-500">${t.noCommodity}</div>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderContent();
        });
    </script>
</body>
</html>
